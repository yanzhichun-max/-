<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>活点地图 · Marauder's Map</title>

<!-- ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★ -->
<!-- 【改这里 1】手写墨字字体                                              -->
<!--  · text= 后面 = 页面上所有会用到手写字体的字，一个字都不能漏！        -->
<!--  · 改名字了，这里也要一起加进去，否则新字显示不出来                  -->
<!--  · 加载不出来就换镜像：fonts.loli.net  →  fonts.lug.ustc.edu.cn      -->
<!-- ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★ -->
<link rel="preconnect" href="https://fonts.loli.net" crossorigin>
<link rel="stylesheet"
  href="https://fonts.loli.net/css2?family=Long+Cang&amp;family=Zhi+Mang+Xing&amp;family=Ma+Shan+Zheng&amp;text=燕知春MischiefManaged&amp;display=swap">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#F2E2BD;
    font-family:Georgia,"Songti SC","STSong",serif;}

  #map-container{position:fixed;inset:0;background:#F2E2BD;z-index:1;}

  /* 瓦片榨成墨线 + 卷轴色 */
  .leaflet-tile-pane{
    filter:grayscale(1) brightness(.8) contrast(2.4) sepia(1) saturate(1.3) hue-rotate(-6deg);
  }

  .noise{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:.12;
    background-image:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)"/></svg>');}
  .vignette{position:fixed;inset:0;z-index:11;pointer-events:none;
    box-shadow:inset 0 0 170px rgba(105,68,22,.5);}

  /* ---------- 标题 ---------- */
  .title{position:fixed;top:18px;left:18px;z-index:100;color:#3A2410;pointer-events:none;
    text-shadow:0 1px 2px rgba(255,250,235,.7);}
  .title h1{
    /* ★★★ 标题字体在这里：换风格就把想用的挪到最前面 ★★★ */
    font-family:"Ma Shan Zheng","STXingkai","Long Cang",Georgia,serif;
    font-size:26px; font-weight:400; letter-spacing:3px;
    border-bottom:2px solid #6B4A22; padding-bottom:4px; display:inline-block;
  }
  .title p{font-family:Georgia,"Songti SC",serif;
    font-size:12px;font-style:italic;opacity:.8;margin-top:5px;}

  /* ---------- 状态栏 ---------- */
  .status{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:100;
    background:rgba(246,233,203,.95);border:1px solid #6B4A22;border-radius:4px;
    padding:7px 12px;font-size:11px;line-height:1.6;color:#3A2410;
    font-family:Consolas,monospace;white-space:nowrap;
    box-shadow:0 3px 12px rgba(60,35,10,.25);}
  .status b{color:#8B4513;}

  /* ---------- 按钮 ---------- */
  .btn{position:fixed;left:16px;z-index:100;
    background:linear-gradient(#8B5A2B,#5D3A1A);color:#F6E9CB;border:2px solid #A0713C;
    border-radius:5px;padding:9px 13px;font-family:Georgia,serif;font-size:12px;cursor:pointer;
    box-shadow:0 3px 10px rgba(60,35,10,.35);}
  .btn:active{transform:translateY(1px);}
  #recenter{bottom:16px;}
  #srcBtn{bottom:62px;}

  /* ---------- 授权提示 ---------- */
  .auth{position:fixed;inset:auto 0 0 0;z-index:200;text-align:center;color:#F6E9CB;
    padding:70px 20px 95px;transition:opacity .6s;
    background:linear-gradient(to top,rgba(52,35,16,.96),rgba(52,35,16,0));}
  .auth.hide{opacity:0;pointer-events:none;}
  .auth p{font-size:15px;font-style:italic;margin-bottom:14px;}
  .auth button{background:linear-gradient(#8B5A2B,#5D3A1A);color:#F6E9CB;
    border:2px solid #A0713C;border-radius:5px;padding:12px 30px;
    font-family:Georgia,serif;font-size:15px;cursor:pointer;}

  /* =================★ 名字：手写墨字 =================*/
  .nm{
    position:absolute; left:0; bottom:8px; transform:translateX(-50%);
    white-space:nowrap;

    /* ★★★ 名字字体在这里：换风格就把想用的挪到最前面 ★★★
       Long Cang   = 细笔随性（最像电影细墨字）
       Zhi Mang Xing = 行书连笔
       Ma Shan Zheng = 毛笔楷书（偏粗）
       后面几个是加载失败时的备用系统字体 */
    font-family:"Long Cang","Zhi Mang Xing","Ma Shan Zheng",
                "STKaiti","Kaiti SC","KaiTi",Georgia,serif;

    font-size:22px;      /* ★ 手写字偏细，觉得小就调大，如 26px */
    font-weight:400;     /* ★ 手写体千万别加粗，会糊成一团 */
    letter-spacing:2px;
    color:#2E1B08;
    text-shadow:0 0 3px rgba(246,233,203,.95), 0 1px 2px rgba(246,233,203,.9);
  }

  /* =================★ 脚印 =================*/
  .fpw{position:absolute;left:0;top:0;width:0;height:0;}
  .fp{
    position:absolute; left:-3.5px; top:-8px; width:7px; height:16px;
    background:radial-gradient(ellipse at 50% 35%, #2E1B08 0%, #2E1B08 45%, rgba(46,27,8,0) 92%);
    border-radius:50% 50% 42% 42% / 58% 58% 42% 42%;
    animation:fpFade 9s ease-out forwards;
  }
  @keyframes fpFade{0%{opacity:.55;}60%{opacity:.42;}100%{opacity:0;}}

  .leaflet-control-attribution{font-size:9px!important;
    background:rgba(246,233,203,.7)!important;color:#6B4A22!important;}
  .leaflet-control-attribution a{color:#6B4A22!important;}
</style>
</head>
<body>

<div id="map-container"></div>
<div class="noise"></div>
<div class="vignette"></div>

<div class="title"><h1>Mischief Managed</h1><p>活点地图 · 实时追踪</p></div>

<button class="btn" id="srcBtn">瓦片源</button>
<button class="btn" id="recenter" style="display:none">◉ 回到我的位置</button>

<div class="status" id="status">正在加载魔法地图…</div>

<div class="auth" id="auth">
  <p>活点地图需要你的位置授权，才能显现你的踪迹</p>
  <button id="authBtn">授权定位</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
   【改这里 2】所有可调参数都在这儿
   ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★ */
var CFG={
  name:'燕知春',          /* ★ 你的名字（改完记得去上面 text= 那里也加上） */
  showFootprints:true,    /* ★ 不要脚印 → false */
  trailLife:9000,         /* ★ 脚印留多久(毫秒)。想留长路 → 20000 或 60000 */
  stepMeters:3,           /* ★ 脚印密度。太密改 5 或 6，太疏改 1.5 */
  minMoveMeters:2.5,      /* 站着不动不留脚印 */
  maxStepsPerUpdate:8,
  maxFootprints:70,       /* 屏幕上最多几只脚印（防卡顿） */
  zoom:17                 /* ★ 缩放级别，17~18 才能看见建筑 */
};

/* ================= 瓦片源（德国源默认第一个，实测能开） ================= */
var SOURCES=[
  {n:'OSM 德国', u:'https://tile.openstreetmap.de/{z}/{x}/{y}.png',
   a:'&copy; OpenStreetMap contributors', mz:18},
  {n:'OSM 官方', u:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
   a:'&copy; OpenStreetMap contributors', mz:19},
  {n:'OSM 法国', u:'https://a.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png',
   a:'&copy; OpenStreetMap France', mz:19},
  {n:'CARTO 素', u:'https://a.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png',
   a:'&copy; OpenStreetMap &copy; CARTO', mz:19}
];
var si=0, tileLayer=null;
function $(id){return document.getElementById(id);}

/* ================= 初始化地图 ================= */
var HOME=[31.970430, 118.746435];
var map=L.map('map-container',{
  zoomControl:false, attributionControl:true,
  center:HOME, zoom:CFG.zoom, zoomSnap:1, zoomDelta:1
});
addTiles();

function addTiles(){
  var s=SOURCES[si];
  tileLayer=L.tileLayer(s.u,{
    maxZoom:s.mz, maxNativeZoom:s.mz, minZoom:3,
    attribution:s.a, crossOrigin:true
  }).addTo(map);
  tileLayer.on('tileerror',function(){
    $('status').innerHTML='⚠️ 瓦片加载失败，点左下「瓦片源」换一个';
  });
}

/* ================= 状态 ================= */
var meMarker=null, lastFix=null, lastFp=0, sideFlip=1;
var fpList=[], follow=true;

map.on('dragstart',function(){ follow=false; });

/* ================= 定位（OSM 是 WGS-84，直接用，不转换） ================= */
function requestLocation(){
  if(!navigator.geolocation){ $('status').textContent='❌ 设备不支持定位'; return; }
  $('status').textContent='正在施展追踪咒语…';
  navigator.geolocation.watchPosition(onFix,onErr,{
    enableHighAccuracy:true, timeout:15000, maximumAge:0
  });
}

function onFix(pos){
  var lat=pos.coords.latitude, lng=pos.coords.longitude;
  var acc=(pos.coords.accuracy!=null)?Math.round(pos.coords.accuracy):'?';
  var ll=[lat,lng];

  $('auth').classList.add('hide');
  $('recenter').style.display='block';
  $('status').innerHTML='精度 <b>±'+acc+'m</b>　'+lat.toFixed(6)+', '+lng.toFixed(6);

  if(!lastFix){
    map.setView(ll,CFG.zoom);
    ensureMarker(ll);
  }else{
    var d=dist(lastFix[0],lastFix[1],lat,lng);
    if(d>CFG.minMoveMeters){
      if(CFG.showFootprints) walkTrail(lastFix,ll);
      if(follow) map.panTo(ll);
    }
    ensureMarker(ll);
  }
  lastFix=ll;
}

function onErr(e){
  var m={1:'你拒绝了追踪咒语',2:'魔法感应不到你的位置',3:'追踪咒语超时'}[e.code]||'未知魔法错误';
  $('status').innerHTML='❌ '+m;
}

/* ================= 名字（只有墨字，没圈没点） ================= */
var nameIcon=L.divIcon({
  className:'',
  html:'<div class="nm">'+CFG.name+'</div>',
  iconSize:[0,0], iconAnchor:[0,0]
});

function ensureMarker(ll){
  if(meMarker){ meMarker.setLatLng(ll); return; }
  meMarker=L.marker(ll,{icon:nameIcon,interactive:false,zIndexOffset:1000}).addTo(map);
}

/* ================= 脚印 ================= */
function walkTrail(a,b){
  var now=Date.now();
  if(now-lastFp<800) return;
  lastFp=now;

  var d=dist(a[0],a[1],b[0],b[1]);
  var brg=bearing(a[0],a[1],b[0],b[1]);
  var steps=Math.min(CFG.maxStepsPerUpdate,
                     Math.max(1, Math.round(d/CFG.stepMeters)));

  for(var i=1;i<=steps;i++){
    var f=i/(steps+1);
    var lat=a[0]+(b[0]-a[0])*f;
    var lng=a[1]+(b[1]-a[1])*f;

    sideFlip=-sideFlip;
    var perp=(brg+90)*Math.PI/180;
    var offM=1.7*sideFlip;
    var mLat=111320;
    var mLng=111320*Math.cos(lat*Math.PI/180);
    var dLat=Math.cos(perp)*offM/mLat;
    var dLng=Math.sin(perp)*offM/mLng;

    addFoot([lat+dLat, lng+dLng], brg);
  }
}

function addFoot(ll,brg){
  var html='<div class="fpw" style="transform:rotate('+brg.toFixed(1)+'deg)">'+
             '<div class="fp" style="animation-duration:'+CFG.trailLife+'ms"></div>'+
           '</div>';
  var ic=L.divIcon({className:'',html:html,iconSize:[0,0],iconAnchor:[0,0]});
  var m=L.marker(ll,{icon:ic,interactive:false,zIndexOffset:100}).addTo(map);

  fpList.push(m);
  if(fpList.length>CFG.maxFootprints){
    var old=fpList.shift(); map.removeLayer(old);
  }
  setTimeout(function(){
    map.removeLayer(m);
    var i=fpList.indexOf(m); if(i>-1) fpList.splice(i,1);
  }, CFG.trailLife+200);
}

/* ================= 方位角 ================= */
function bearing(lat1,lng1,lat2,lng2){
  var r=Math.PI/180;
  var y=Math.sin((lng2-lng1)*r)*Math.cos(lat2*r);
  var x=Math.cos(lat1*r)*Math.sin(lat2*r)-
        Math.sin(lat1*r)*Math.cos(lat2*r)*Math.cos((lng2-lng1)*r);
  return (Math.atan2(y,x)/r+360)%360;
}

/* ================= 距离（米） ================= */
function dist(lat1,lng1,lat2,lng2){
  var R=6371000, r=Math.PI/180;
  var dLat=(lat2-lat1)*r, dLng=(lng2-lng1)*r;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+
        Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* ================= 按钮 ================= */
$('srcBtn').onclick=function(){
  si=(si+1)%SOURCES.length;
  if(tileLayer) map.removeLayer(tileLayer);
  addTiles();
  $('srcBtn').textContent='瓦片源：'+SOURCES[si].n;
  $('status').textContent='已切换：'+SOURCES[si].n;
};
$('recenter').onclick=function(){
  follow=true;
  if(lastFix) map.setView(lastFix,CFG.zoom);
};
$('authBtn').onclick=requestLocation;

document.addEventListener('gesturestart',function(e){e.preventDefault();});
$('srcBtn').textContent='瓦片源：'+SOURCES[si].n;
</script>
</body>
</html>
